name: "CI"

on:
  pull_request:
  push:
    branches:
      # NOTE: make sure any branches here are also valid directory names,
      # otherwise creating the directory and uploading to s3 will fail
      - main
      - master
  merge_group:
  release:
    types:
      - published

permissions:
  id-token: "write"
  contents: "read"
  pull-requests: "write"
  statuses: "write"
  deployments: "write"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@main
      - run: nix flake show --all-systems --json

  build_x86_64-linux:
    uses: ./.github/workflows/build.yml
    with:
      system: x86_64-linux
      runner: ubuntu-latest
      runner_for_virt: ubuntu-latest
      runner_small: ubuntu-latest
      run_tests: true
      run_vm_tests: true
      run_regression_tests: true
      publish_manual: true
    secrets:
      manual_netlify_auth_token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      manual_netlify_site_id: ${{ secrets.NETLIFY_SITE_ID }}
      sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      sentry_org: ${{ secrets.SENTRY_ORG }}
      sentry_project: ${{ secrets.SENTRY_PROJECT }}

  build_aarch64-linux:
    uses: ./.github/workflows/build.yml
    with:
      system: aarch64-linux
      runner: ubuntu-latest-arm
      runner_for_virt: ubuntu-latest-arm
      runner_small: ubuntu-latest-arm
    secrets:
      sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      sentry_org: ${{ secrets.SENTRY_ORG }}
      sentry_project: ${{ secrets.SENTRY_PROJECT }}

  build_aarch64-darwin:
    uses: ./.github/workflows/build.yml
    with:
      system: aarch64-darwin
      runner: macos-latest
      runner_for_virt: macos-latest
      runner_small: macos-latest
    secrets:
      sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      sentry_org: ${{ secrets.SENTRY_ORG }}
      sentry_project: ${{ secrets.SENTRY_PROJECT }}
